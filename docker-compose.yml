name: yuma-shield

x-app: &app
  image: yuma-shield-app
  build:
    context: .
    dockerfile: services/api/Dockerfile
  network_mode: host
  environment: &app-env
    POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    KAFKA_BOOTSTRAP: localhost:29092
    CONFIG_DIR: /app/config
    ARTIFACTS_DIR: /app/artifacts

services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: shield
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports: ["${KAFKA_UI_PORT:-8080}:8080"]

  grafana:
    image: grafana/grafana-oss:11.2.0
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3000}
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port ${API_PORT:-8000} --workers 2
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    volumes:
      - ./config:/app/config:ro
      - ./ml/artifacts:/app/artifacts:ro
    restart: unless-stopped

  persister:
    <<: *app
    command: python -m app.workers.persister
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  loader:
    <<: *app
    profiles: ["tools"]
    command: python -m shield_ml.load_case
    environment:
      <<: *app-env
      CASE_DATA_DIR: /data
    volumes:
      - ./docs/Caso_de_estudio_Yuma_Pay/03_Datos:/data:ro

  sandbox:
    image: python:3.12-slim
    network_mode: host
    profiles: ["tools"]
    command: ["python", "/sandbox/mock_api.py", "--puerto", "${SANDBOX_PORT:-8090}", "--datos", "/data"]
    volumes:
      - ./docs/Caso_de_estudio_Yuma_Pay/04_Sandbox_API:/sandbox:ro
      - ./docs/Caso_de_estudio_Yuma_Pay/03_Datos:/data:ro

  portal:
    build: ./services/portal
    image: yuma-shield-portal
    network_mode: host
    environment:
      <<: *app-env
      PORTAL_PORT: ${PORTAL_PORT:-8501}
      ARTIFACTS_DIR: /artifacts
      CONTROL_URL: http://localhost:${SIM_PORT:-8001}
      API_URL: http://localhost:${API_PORT:-8000}
      SANDBOX_URL: http://localhost:${SANDBOX_PORT:-8090}
    volumes:
      - ./ml/artifacts:/artifacts:ro
    restart: unless-stopped

  trainer:
    <<: *app
    profiles: ["tools"]
    command: python -m shield_ml.train
    volumes:
      - ./config:/app/config
      - ./ml/artifacts:/app/artifacts

  baseline:
    build: ./services/baseline
    network_mode: host
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CONFIG_DIR: /app/config
      BASELINE_INTERVAL_SECONDS: ${BASELINE_INTERVAL_SECONDS:-30}
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

  replay:
    <<: *app
    profiles: ["tools"]
    command: python -m app.workers.replay
    volumes:
      - ./config:/app/config:ro
      - ./ml/artifacts:/app/artifacts:ro

  simulator: &simulator
    build: ./services/simulator
    image: yuma-shield-simulator
    profiles: ["tools"]
    network_mode: host
    environment: &simulator-env
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_BOOTSTRAP: localhost:29092
      API_URL: http://localhost:${API_PORT:-8000}
      SANDBOX_URL: http://localhost:${SANDBOX_PORT:-8090}
      OUT_DIR: /out
    volumes:
      - ./ml/artifacts:/out

  control:
    <<: *simulator
    profiles: []
    command: ["serve", "--port", "${SIM_PORT:-8001}"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  kafkadata:
  grafanadata:
