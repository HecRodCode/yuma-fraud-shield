apiVersion: 1
datasources:
  - name: Shield Postgres
    uid: shield-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: ${POSTGRES_HOST}:${POSTGRES_PORT}
    user: grafana_ro
    secureJsonData:
      password: grafana_ro
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
    isDefault: true
